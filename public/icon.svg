<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Vibrant Orange Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Accent Emerald Check Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#EA580C" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Glow Accent Ring -->
  <rect x="36" y="36" width="440" height="440" rx="100" stroke="#334155" stroke-width="3" stroke-opacity="0.6" fill="none" />

  <!-- Main Orange Icon Badge -->
  <rect x="76" y="76" width="360" height="360" rx="80" fill="url(#brandGrad)" filter="url(#glowShadow)" />

  <!-- Subtle Top Highlight inside Badge -->
  <path d="M76 156 C76 111.8 111.8 76 156 76 L356 76 C400.2 76 436 111.8 436 156 L436 210 L76 210 Z" fill="#FFFFFF" opacity="0.12" />

  <!-- Stylized Modern Document Base -->
  <rect x="136" y="136" width="240" height="240" rx="36" fill="#0F172A" opacity="0.85" filter="url(#dropShadow)" />

  <!-- Document Header Bar -->
  <path d="M136 172 C136 152.1 152.1 136 172 136 L340 136 C359.9 136 376 152.1 376 172 L376 196 L136 196 Z" fill="#1E293B" />

  <!-- Mini invoice lines -->
  <rect x="176" y="224" width="160" height="14" rx="7" fill="#F8FAFC" opacity="0.9" />
  <rect x="176" y="254" width="115" height="14" rx="7" fill="#CBD5E1" opacity="0.75" />
  <rect x="176" y="284" width="135" height="14" rx="7" fill="#CBD5E1" opacity="0.75" />

  <!-- Prominent Bold "SF" Monogram Badge -->
  <rect x="156" y="160" width="200" height="192" rx="28" fill="#0F172A" stroke="#EA580C" stroke-width="4" opacity="0.95" />

  <!-- Stylized "SF" Monogram Typography -->
  <text x="256" y="292" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="114" fill="#FFFFFF" letter-spacing="-4">SF</text>

  <!-- Stock & Growth Indicator Bars -->
  <rect x="180" y="318" width="30" height="8" rx="4" fill="#FB923C" />
  <rect x="220" y="314" width="30" height="12" rx="4" fill="#F97316" />
  <rect x="260" y="310" width="30" height="16" rx="4" fill="#EA580C" />
  <rect x="300" y="304" width="32" height="22" rx="4" fill="#10B981" />

  <!-- Success Checkmark Badge (Bottom Right) -->
  <circle cx="376" cy="376" r="48" fill="url(#checkGrad)" filter="url(#dropShadow)" stroke="#0F172A" stroke-width="6" />
  <path d="M358 376 L371 389 L396 363" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
</svg>
